[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -2 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Approved third-party deps only — see SPEC.md §5.11.
[workspace.dependencies]
rustc-hash = "2" # 3.x was yanked from crates.io; 2.1.x is the latest resolvable line
indexmap = "2"
memchr = "2"
serde = "1"
serde_json = "1"
# Spec deviation (PORTING-NOTES): Go uses math/big for PseudoBigInt and
# huge-int parsing; Rust has no std bigint so num-bigint fills that role.
num-bigint = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Spec deviation (PORTING-NOTES): tsc-fswatch implements Go's hand-rolled
# inotify/fanotify/FSEvents/kqueue backends on top of notify's
# RecommendedWatcher instead.
notify = "8"
# Spec deviation (PORTING-NOTES): Go uses runtime/pprof for --diagnostics
# profiling; pprof-rs produces the same protobuf format for CPU profiles.
pprof = { version = "0.15", features = ["prost-codec"] }
flate2 = "1"
prost = "0.12"
# Spec deviation (SPEC §5.11 conditional use): lsutil/organizeimports.go uses
# golang.org/x/text/unicode/norm (NFD in removeDiacritics) — the spec
# anticipates unicode-normalization exactly for this.
unicode-normalization = "0.1"
# mimalloc returns freed memory to the OS far more aggressively than glibc
# malloc (the baseline runner's per-test checker churn otherwise pins the
# process at a multi-GB high-water mark).
mimalloc = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
