[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -2 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
