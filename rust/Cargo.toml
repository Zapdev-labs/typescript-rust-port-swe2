[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -2 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Approved third-party deps only — see SPEC.md §5.11.
[workspace.dependencies]
rustc-hash = "2" # 3.x was yanked from crates.io; 2.1.x is the latest resolvable line
indexmap = "2"
memchr = "2"
serde = "1"
serde_json = "1"
# Spec deviation (PORTING-NOTES): Go uses math/big for PseudoBigInt and
# huge-int parsing; Rust has no std bigint so num-bigint fills that role.
num-bigint = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
