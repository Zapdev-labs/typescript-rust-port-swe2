[package]
name = "tsc-modulespecifiers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tsc-ast = { path = "../ast" }
tsc-collections = { path = "../collections" }
tsc-core = { path = "../core" }
tsc-debug = { path = "../debug" }
tsc-module = { path = "../module" }
tsc-outputpaths = { path = "../outputpaths" }
tsc-packagejson = { path = "../packagejson" }
tsc-stringutil = { path = "../stringutil" }
tsc-symlinks = { path = "../symlinks" }
tsc-tspath = { path = "../tspath" }
tsc-tsoptions = { path = "../tsoptions" }
rustc-hash = { workspace = true }

[dev-dependencies]
# PORT: Go tests build `ExportsOrImports` struct literals; the Rust type has a
# private `object_kind` field, so the tests decode them from JSON via tsc-json.
tsc-json = { path = "../json" }
